<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="main-container">
        <div class="left-section-container">
            <div class="text-wrapper">
                <h1>Bawa Kesegaran Alam ke Rumah Anda</h1>
                <p>Solusi belanja tanaman hias berkualitas secara online. Praktis, terpercaya, dan siap memperindah sudut ruangan Anda.</p>
            </div>
        </div>
        <form action="" method="post" class="form-container">
            <h1>Buat Akun Baru</h1>
            <div class="fields-wrapper">
                <div class="field-container">
                    <div class="input-text-container">
                        <div class="icon-container">
                            <span class="bx--user"></span>
                        </div>
                        <input type="text" name="username" id="username" placeholder="Buat Username ..." required>
                    </div>
                    <hr>
                </div>
                <div class="field-container">
                    <div class="input-text-container">
                        <div class="icon-container">
                            <span class="eva--email-outline"></span>
                        </div>
                        <input type="email" name="username" id="username" placeholder="Masukan E-mail ..." required>
                    </div>
                    <hr>
                </div>
                <div class="field-container">
                    <div class="input-text-container">
                        <div class="icon-container">
                            <span class="ph--lock-bold"></span>
                        </div>
                        <input type="password" name="username" id="username" placeholder="Buat Kata Sandi ..." required>
                    </div>
                    <hr>
                </div>
                <div class="field-container">
                    <div class="input-text-container">
                        <div class="icon-container">
                            <span class="ph--lock-bold"></span>
                        </div>
                        <input type="password" name="username" id="username" placeholder="Ulangi Kata Sandi ..." required>
                    </div>
                    <hr>
                </div>
            </div>
            <div class="button-section">
                <button type="submit" class="btn-signup">Daftar Sekarang</button>
                <div class="separator"><hr><span>atau</span><hr></div>
                <button type="button" class="btn-login">Masuk</button>
                <div class="txt-login-wrapper">
                    <span>Sudah memiliki akun? <a href="https://example.com">Masuk</a></span>
                </div>
            </div>
        </form>
    </div>
    <link rel="stylesheet" href="style.css">
</body>
</html>
